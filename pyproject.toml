[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "low-altitude-newsroom"
version = "0.1.0"
description = "低空经济新闻收集、核查与待审稿工作流"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lowalt-news = "lowalt_newsroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
